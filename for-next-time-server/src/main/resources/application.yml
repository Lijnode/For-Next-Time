spring:
  application:
    name: for-next-time-server
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:files}
    public-url-prefix: ${FILE_PUBLIC_URL_PREFIX:/files}
