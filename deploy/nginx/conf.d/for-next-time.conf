# This file is included by the shared gateway Nginx instance.
# The application itself is available under /time and /time/m.

location = /time {
    rewrite ^ /time/ last;
}

location = /time/m {
    rewrite ^ /time/m/ last;
}

location ^~ /time/m/ {
    alias /srv/apps/for-next-time/h5/;
    try_files $uri $uri/ /time/m/index.html;
}

location ^~ /time/ {
    alias /srv/apps/for-next-time/pc/;
    try_files $uri $uri/ /time/index.html;
}

location ^~ /time/api/ {
    set $for_next_time_backend for-next-time-backend:6688;
    rewrite ^/time(/api/.*)$ $1 break;
    proxy_pass http://$for_next_time_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /time/files/ {
    set $for_next_time_backend for-next-time-backend:6688;
    rewrite ^/time(/files/.*)$ $1 break;
    proxy_pass http://$for_next_time_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
